# yaml-language-server: $schema=./config.schema.json
logging:
  level: info
  request: forbidden
  database: warn
  format: json
network:
  trustProxy: false
  ipHeader: x-forwarded-for
database:
  url: file:./dev.db
session:
  secret: this_is_a_secret_key_and_you_must_change_it
  salt: you_must_change_
  # Access token expiry (days)
  expiry: 30
feature: {}
storage:
  file:
    type: local
    baseDir: ./data
